name: Deploy the queue API to staging

# Staging on demand, from anywhere — including a phone, which is the point.
# The show is five days long and the only person moderating it will be walking
# a hall with no laptop; "check it on staging first" has to be a button, not a
# checked-out repository and a wrangler login.
#
# This deploys the API Worker's `staging` environment only. It never touches
# the site, never touches production, and cannot: `--env staging` selects the
# gc2026-queues-api-staging Worker, which has its own database, its own admin
# secret and no routes at all, so it answers on workers.dev and nowhere else.
#
# It is also the bootstrap. `wrangler versions upload`, which the pull request
# previews use, refuses to run against a Worker that does not exist yet — so
# the staging Worker has to be deployed once, by hand, before previews of it
# can work. This is that once, and it stays for every time after.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: "Apply pending D1 migrations to the staging database first"
        type: boolean
        default: true

permissions:
  contents: read

# Never queue behind, or cancel, a production deploy.
concurrency:
  group: staging-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install development tools
        run: npm ci

      # Staging exists to be believed, so it does not get code the suite has
      # not run against.
      - name: Test the Worker
        run: npx vitest run

      - name: Refuse an unprovisioned database
        run: |
          staging_id="$(awk '/^\[env\.staging\]/ { seen = 1 } seen && /^database_id = / { print $3; exit }' wrangler-api.toml)"
          if [ "$staging_id" = '"00000000-0000-0000-0000-000000000000"' ] || [ -z "$staging_id" ]; then
            echo "::error::wrangler-api.toml still holds the placeholder staging database_id. Create the database first — docs/DEPLOYING.md, 'Queue backend: first deployment'."
            exit 1
          fi
          echo "staging database: $staging_id"

      # Before the code that reads it, and backward-compatible by rule, so a
      # rollback of the Worker does not leave the schema ahead of it.
      - name: Apply staging D1 migrations
        if: inputs.migrate
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: d1 migrations apply QUEUE_DB --remote --config wrangler-api.toml --env staging

      - name: Deploy the staging API
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: deploy --config wrangler-api.toml --env staging

      # The URL is not knowable here — half of it is the account subdomain —
      # so read it out of wrangler's own output, and say plainly if the admin
      # secret has never been set, because that is the one thing a deploy
      # cannot do for you and the one thing whose absence is invisible.
      - name: Where it landed
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' <<<"$OUTPUT" | head -n1 || true)
          {
            echo "### Staging API deployed"
            echo
            if [ -n "$url" ]; then
              echo "- \`$url/api/queue/live\` — 403 outside show hours is the correct answer, not a fault."
              echo "- \`$url/api/admin/\` — the moderation console."
            else
              echo "Deployed, but no workers.dev URL appeared in the output — check \`workers_dev\` in wrangler-api.toml."
            fi
            echo
            echo "If \`/api/admin/\` will not accept any token, its secret has never been set:"
            echo '```'
            echo "npx wrangler secret put ADMIN_TOKEN --config wrangler-api.toml --env staging"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
