name: Deploy PR previews to Cloudflare

# Uploads each pull request as a *version* — Workers' own preview system, not a
# throwaway Worker — and comments the URLs on the PR. A version is not a
# deployment: nothing any real hostname serves changes until the merge lands on
# main and cloudflare.yml deploys it, and `versions upload` does not apply
# triggers, so no route or custom domain can move from here.
#
# Two Workers, previewed differently, and the difference is the point:
#
#   site — a version of the production site Worker. Safe because that Worker
#          has no bindings at all: assets and nothing else.
#   api  — a version of the *staging* API Worker (`--env staging`), so the
#          bindings it inherits are the staging database and the staging admin
#          token. A preview therefore cannot reach the show's data, by
#          configuration rather than by a check. Uploading it to the top-level
#          environment would hand unreviewed code the production database.
#
# The two previews are not wired to each other: `/api/*` is a zone route, and
# workers.dev has no zones, so the site preview has no API behind it and the
# queue tab shows its offline notice there. Reviewing the whole loop is what
# staging is for.
#
# The same-repository check on the job is the guard. A PR is arbitrary HTML
# and JavaScript, and a preview publishes it, live and public, on a
# *.workers.dev URL carrying this project's name — granting that automatically
# to any fork is free hosting for phishing pages. GitHub already withholds the
# secrets from fork-triggered pull_request runs; the `if` turns what would be
# a confusing red failure into an honest skip. To preview a fork PR after
# reading its diff, run the same upload from a laptop — docs/DEPLOYING.md,
# "PR previews".

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # the preview-URL comment below

# One run per PR, newest push wins. Deliberately not the production group from
# cloudflare.yml: a preview must never queue behind a production deploy, and
# must never cancel one.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  site:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same gate the production deploy runs. It matters more here, not
      # less: a malformed JSON file renders an empty guide rather than an
      # error page, so a preview of it would look "deployed" and review-ready.
      - name: Validate data files
        run: |
          for f in data/*.json data/hallplan/*.json manifest*.webmanifest; do
            python3 -m json.tool "$f" > /dev/null || exit 1
          done

      - name: Stage the site
        run: tools/build-site.sh

      # Same two secrets as cloudflare.yml; a version upload needs no scopes
      # beyond them. --preview-alias keeps pr-<n>-gc2026-guide.<subdomain>
      # .workers.dev pointed at this PR's newest push, so the URL in the
      # comment survives every push; the version's own one-off URL rides
      # along in the output as well.
      - name: Upload the preview version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      # One comment per PR, edited in place on every push; the marker is how
      # later runs find it again. The URLs are read out of wrangler's own
      # output because half of each — the account subdomain — is not knowable
      # here. The alias URL starts with pr-<n>-, the versioned URL with the
      # first eight hex characters of the version id; finding neither means
      # previews are off (preview_urls in wrangler.toml) and the run should
      # say so rather than comment nothing.
      - name: Comment the preview URLs on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTPUT: ${{ steps.upload.outputs.command-output }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          urls=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' <<<"$UPLOAD_OUTPUT" | sort -u || true)
          alias_url=$(grep -m1 "^https://pr-$PR-" <<<"$urls" || true)
          version_url=$(grep -m1 -E '^https://[0-9a-f]{8}-' <<<"$urls" || true)

          if [ -z "$alias_url$version_url" ]; then
            echo "No preview URL in wrangler's output. Is preview_urls still true in wrangler.toml?" >&2
            printf '%s\n' "$UPLOAD_OUTPUT" >&2
            exit 1
          fi

          links=""
          [ -n "$alias_url" ] && links="- $alias_url — this PR, updating in place on every push"$'\n'
          [ -n "$version_url" ] && links="$links- $version_url — this push only"

          marker="<!-- cloudflare-preview-comment -->"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "$marker" \
            "**Preview** of $SHA, uploaded as a version of the production Worker — deployed nowhere. hallgui.de does not change until this merges." \
            "$links" \
            "The PR link is one origin across pushes, so the service worker updates there the way it does in production: the first load after a push can serve the one before. Reload once more, or use the per-push link, which is a fresh origin every time.")

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # Only when the API actually changed: a CSS-only pull request has no reason
  # to spend a version, and every alias is retained against a per-Worker limit.
  api:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Should this PR get an API preview?
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          skip() { echo 'api=false' >> "$GITHUB_OUTPUT"; echo "::notice::$1"; exit 0; }

          # A pull_request checkout is the shallow merge ref, so neither of
          # these commits is necessarily present. Fetch both — `git diff A B`
          # compares two trees and needs no merge base, so depth 1 is enough.
          git fetch --depth=1 origin "$BASE" "$HEAD"
          git diff --name-only "$BASE" "$HEAD" \
            | grep -qE '^(worker/|wrangler-api\.toml$|data/(exhibitors|event)\.json$)' \
            || skip "No API changes in this PR — skipping its preview."

          staging_id="$(awk '/^\[env\.staging\]/ { seen = 1 } seen && /^database_id = / { print $3; exit }' wrangler-api.toml)"
          if [ "$staging_id" = '"00000000-0000-0000-0000-000000000000"' ] || [ -z "$staging_id" ]; then
            skip "The staging queue database is not provisioned yet. See docs/DEPLOYING.md, 'Queue backend: first deployment'."
          fi

          echo 'api=true' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.api == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install development tools
        if: steps.changed.outputs.api == 'true'
        run: npm ci

      # The precondition `versions upload` actually has: a Worker to be a
      # version *of*. It refuses outright against one that has never been
      # deployed, and that first deploy is a person pressing the button on the
      # staging workflow — not something a pull request should do for them. So
      # ask, and skip with the answer rather than failing every pull request
      # with an error about the backend. Needs the toolchain above, so it
      # cannot live with the cheaper checks.
      - name: Does the staging Worker exist yet?
        id: worker
        if: steps.changed.outputs.api == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --no-install wrangler versions list \
               --config wrangler-api.toml --env staging > /dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo "::notice::The staging API Worker has not been deployed yet, so there is no Worker to upload a version of. Run the 'Deploy the queue API to staging' workflow once."
          fi

      # The API's review is its test suite far more than its URL, so a failing
      # suite must not produce a preview somebody then pokes at by hand.
      - name: Test the Worker
        if: steps.changed.outputs.api == 'true' && steps.worker.outputs.exists == 'true'
        run: npx vitest run

      # `--env staging` is the safety property, not a convenience: it selects
      # the staging Worker, whose bindings are the staging database and admin
      # token. Note that migrations are NOT applied here — a PR that adds one
      # previews against the un-migrated staging schema and will error. Apply
      # it by hand first (docs/DEPLOYING.md); automating it would let any open
      # PR rewrite the staging schema under the others.
      - name: Upload the API preview version
        if: steps.changed.outputs.api == 'true' && steps.worker.outputs.exists == 'true'
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.123.0"
          command: versions upload --config wrangler-api.toml --env staging --preview-alias pr-${{ github.event.pull_request.number }} --message pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      - name: Comment the API preview URL on the PR
        if: steps.changed.outputs.api == 'true' && steps.worker.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTPUT: ${{ steps.upload.outputs.command-output }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          urls=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' <<<"$UPLOAD_OUTPUT" | sort -u || true)
          alias_url=$(grep -m1 "^https://pr-$PR-" <<<"$urls" || true)

          if [ -z "$alias_url" ]; then
            echo "No preview URL in wrangler's output. Is preview_urls still true in wrangler-api.toml?" >&2
            printf '%s\n' "$UPLOAD_OUTPUT" >&2
            exit 1
          fi

          marker="<!-- cloudflare-api-preview-comment -->"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "$marker" \
            "**Queue API preview** of $SHA, uploaded as a version of the *staging* API Worker." \
            "- $alias_url/api/queue/live" \
            "It is bound to the staging database and the staging admin token, so nothing here can touch the show's data. The site preview above has no API behind it — \`/api/*\` is a zone route and workers.dev has no zones — so exercise the full loop on staging.")

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
