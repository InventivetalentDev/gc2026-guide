<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<title data-i18n="map.docTitle">Hall map · gamescom 2026 guide</title>
<meta name="description" content="Booth-level hall maps for gamescom 2026, with your saved booths marked. Works offline." data-i18n-attr="content:map.metaDescription">
<!-- Language before first paint — see the same block in index.html. The map
     is reachable on its own, so it resolves the language itself rather than
     inheriting anything from the guide. -->
<script>
  (function () {
    try {
      var supported = ["en", "de"];
      var pick = new URLSearchParams(location.search).get("lang");
      if (supported.indexOf(pick) === -1) {
        pick = JSON.parse(localStorage.getItem("gc2026.prefs.v1") || "{}").lang;
      }
      if (supported.indexOf(pick) === -1) {
        var wanted = navigator.languages || [navigator.language || "en"];
        pick = "en";
        for (var i = 0; i < wanted.length; i++) {
          var code = String(wanted[i]).slice(0, 2).toLowerCase();
          if (supported.indexOf(code) !== -1) { pick = code; break; }
        }
      }
      document.documentElement.lang = pick;
    } catch (e) {
      document.documentElement.lang = "en";
    }
  })();
</script>
<!-- see index.html — canonical is absolute so it also points the old domain here -->
<link rel="canonical" href="https://gamescom.guide/map.html">

<!-- No manifest link: the map is inside the guide's scope ("./"), so an
     install from here is the same installed app. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- same favicon as the guide: one app, one tab icon (index.html:26) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%23ff4d17'/><text x='50' y='72' font-size='58' font-family='monospace' font-weight='700' text-anchor='middle' fill='%230c0c0d'>26</text></svg>">

<link rel="stylesheet" href="css/fonts.css">
<!-- the guide's tokens and shared components (.chip, .badge) first, then
     the map's own layer — one palette, no second copy to drift -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/map.css">
</head>
<body class="map-page">

<header class="map-bar">
  <a class="map-back" href="./" aria-label="Back to the guide" data-i18n-attr="aria-label:map.backAria">←</a>
  <span class="map-wordmark"><span class="map-wordmark-num">GC26</span> <span data-i18n="map.title">Hall map</span></span>
  <p class="offline-flag" data-i18n="map.offline">Offline</p>
</header>

<nav class="map-halls" id="halls" aria-label="Halls" data-i18n-attr="aria-label:map.hallsAria"></nav>

<div id="stage">
  <p class="map-load" id="load" data-i18n="map.loading">loading hall …</p>
  <section id="sheet" aria-labelledby="sheet-name" hidden>
    <button class="map-sheet-close" id="sheet-close" type="button" aria-label="Close stand details" data-i18n-attr="aria-label:map.closeSheetAria">×</button>
    <h2 id="sheet-name"></h2>
    <p class="map-sheet-loc" id="sheet-loc"></p>
    <div class="map-sheet-badges" id="sheet-badges"></div>
    <p class="map-sheet-who" id="sheet-who"></p>
    <div class="map-sheet-actions">
      <button class="chip" id="sheet-save" type="button" hidden></button>
      <a class="reset" id="sheet-link" href="./" data-i18n="map.openInGuide">open in guide →</a>
    </div>
  </section>
</div>

<!-- The map is reachable on its own — every map.html#hall/booth link in
     circulation lands here without passing through the guide — so it carries
     its own route to the legal pages rather than borrowing the guide's. -->
<footer class="map-note">
  <span id="counts"></span>
  <span id="srcnote"></span>
  <span><a href="imprint.html" data-i18n="footer.imprint">Imprint</a> · <a href="privacy.html" data-i18n="footer.privacy">Privacy</a> · <button class="lang-switch-link" data-lang-switch type="button" hidden></button></span>
</footer>

<script src="js/i18n/en.js"></script>
<script src="js/i18n/de.js"></script>
<script src="js/i18n.js"></script>
<script src="js/marks.js"></script>
<script src="js/map.js"></script>
<script src="js/pwa.js" defer></script>
</body>
</html>
