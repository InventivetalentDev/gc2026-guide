# Cloudflare Workers deployment for the gamescom 2026 guide — the site.
#
# Assets only: a directory of static files served from the edge, with no Worker
# script and no bindings of any kind. The live queue API is a second Worker
# (wrangler-api.toml) that claims `/api/*` on these same hostnames with routes,
# which are matched ahead of the Custom Domains below. Same origin, no CORS.
#
# Nothing here can reach a database or a secret, which is what makes a pull
# request preview of this Worker harmless — see the note on preview_urls.
#
# That directory is dist/, staged from the repo root by tools/build-site.sh —
# run it before deploying. The site still has no build step; dist/ is a copy
# that holds the site and none of the repo around it, which is what the asset
# directory has to be.
#
# The full setup and domain-cutover runbook is in docs/DEPLOYING.md.

name = "gc2026-guide"
compatibility_date = "2026-08-17"

# gc2026-guide.<subdomain>.workers.dev — the URL a deploy can be checked on
# before any domain points at it, and the one that still answers if a custom
# domain is mid-move. Set false once the retired hostnames are off if you would
# rather the guide answered on gc26.guide and nothing else.
workers_dev = true

# Where .github/workflows/cloudflare-preview.yml puts pull requests to be
# looked at: `wrangler versions upload` gives a PR a version of this same
# Worker at pr-<n>-gc2026-guide.<subdomain>.workers.dev, with production and
# its hostnames untouched — a version is not a deployment, and an upload does
# not apply triggers. That is the whole story only because this Worker has no
# bindings: a version of it inherits nothing, so a preview is the static site
# and nothing else. (`/api/*` does not answer on a preview, since routes are
# a property of zones; the queue tab degrades to its offline notice there.
# The API previews separately — wrangler-api.toml.) Left unset this follows
# workers_dev, so it is pinned true: turning workers_dev off (above) should
# not quietly take the preview system down with it.
preview_urls = true

[assets]
directory = "./dist"

# Both handling options below are deliberate, and the defaults actively break
# this app.
#
# html_handling: the default ("auto-trailing-slash") answers /map.html with a
# 307 to /map, and this app does not survive that.
#
# Online, the browser follows the redirect and lands on /map, which sw.js does
# not recognise as the map — `pageKey` only matches paths ending in /map.html.
# So the map page is cached under "./" and overwrites the guide's own shell
# entry, and opening the app offline afterwards serves the hall map where the
# guide should be.
#
# Offline, the precached copy of the map was itself fetched through that
# redirect, and a redirected response cannot be handed back to a navigation
# request — so the map does not open at all in a hall with no reception, which
# is the entire point of having it.
#
# "none" serves every path exactly as spelled: the URLs GitHub Pages served, and
# the ones every shared map.html#hall/booth link already in circulation asks
# for.
html_handling = "none"

# ...but "none" also stops "/" resolving to index.html, and the shell is
# precached under "./". SPA handling puts that back: any request without an
# exact file match is answered with index.html, so "/" serves the guide and an
# unknown path renders the app rather than a bare 404.
not_found_handling = "single-page-application"

# Kept from before the split. It is not a binding and grants nothing — the
# site Worker still has request metrics worth having, and dropping it would
# have been a silent change to monitoring rather than part of the split.
[observability]
enabled = true

# The home address. Everything the guide says about itself — the canonical
# links, the share links, content@hallgui.de — points here. It has no year in
# it, which is the property the two names before it lacked.
[[routes]]
pattern = "hallgui.de"
custom_domain = true

# Three hostnames are draining behind it, and all three serve the guide rather
# than redirect at the edge for exactly one reason: a saved list is per-origin,
# so a blanket redirect would strand every list built on them. They stay until
# the move notice has had a fair run at the people standing on them (offerMove
# in js/app.js), and come off one at a time, in the order docs/DEPLOYING.md
# sets out.
#
# What a Worker route cannot know is whether the browser asking has anything on
# the hostname to lose, and that is the whole question. So the redirect is in
# the page instead — the head of index.html and map.html — where it can see an
# empty localStorage, an installed app, and a device with no network, and send
# on only the arrivals with nothing at stake.
#
# gamescom.guide is the urgent one. "gamescom" is a registered mark of game —
# Verband der deutschen Games-Branche e.V., unofficial sites have been warned
# off carrying it in a domain, and the show itself is the worst possible moment
# to be arguing about it. It answered for about a day, so the population on it
# is small; retire it first and do not hand it out again.
[[routes]]
pattern = "gamescom.guide"
custom_domain = true

# gc26.guide was the home address for a day and a half. Nothing is wrong with
# it — it is simply an abbreviation, fine to type and useless to say across a
# queue. Its population is small for the same reason gamescom.guide's is.
[[routes]]
pattern = "gc26.guide"
custom_domain = true

[[routes]]
pattern = "gc2026.inventivetalent.org"
custom_domain = true

# The alias domains are NOT routed here, deliberately — hallguide.de, gc26.de,
# gc2026.de, gc27.de, gcgui.de, gcguide.de. They are 301s to hallgui.de, set up
# as Cloudflare Redirect Rules on each zone (docs/DEPLOYING.md step 6): no
# Worker and no entry in this file. Serving the app on them instead would give
# the guide ten origins, and ten per-origin copies of everybody's saved list to
# keep apart. A 301 carries the fragment, so gc26.de/#s?t=... still arrives
# intact.
#
# hallguide.de is the one that matters most: it is how somebody who only heard
# the name would spell it, which is the whole reason the dot can sit where it
# does in hallgui.de.
